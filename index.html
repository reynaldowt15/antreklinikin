<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Klinikin</title>

    <!-- GOOLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- STYLE CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container-fluid">
        <!-- Shania -->
        <header id="header">
            <div class="row align-items-center">
                <div class="col-md-5 col-8">
                    <div class="hospitalName">RUMAH SAKIT UMUM</div>
                    <h1 class="hospitalTitle">Hospital Queue Management System</h1>
                </div>
                <div class="col-md-5 d-md-flex justify-content-center headerQueue">
                    <div class="headerItem text-center">
                        <div class="headerNumber headerWaiting">1</div>
                        <div class="headerStatus">Waiting</div>
                    </div>
                    <div class="headerItem text-center">
                        <div class="headerNumber headerInProgress">1</div>
                        <div class="headerStatus">In Progress</div>
                    </div>
                    <div class="headerItem text-center">
                        <div class="headerNumber headerDone">1</div>
                        <div class="headerStatus">Done Today</div>
                    </div>
                </div>
                <div class="col-md-2 col-4 text-end headerRight">
                    <div class="headerDay">Monday</div>
                    <div class="headerDate">17 Aug 2026</div>
                </div>
            </div>
        </header>

        <!-- Ilham -->
        <section class="doctors-section">
            <div class="section-header">
                <h2>Doctors on Duty</h2>
            </div>
            <div class="doctor-list" id="doctor-list"></div>
        </section>

        <main>
            <!-- Olga -->
            <section id="doctorsSchedule">

            </section>

            <!-- Reynaldo -->
            <section id="queueList">

            </section>
        </main>

        <!-- Daaniys -->
        <section id="bookAConsultation"> 
            <div class="book">
        <h2 class="judul">Book a Consultation</h2>
        <p class="text-xs">
            Register your name and select a doctor to join the queue.
        </p>
        <form class="row g-3">
            <div class="col-md-4">
                <label class="form-label">FULL NAME <span class="rose">*</span></label>
                <input type="text" class="form-control" placeholder="e.g. Ahmad Putra">
            </div>
            <div class="col-md-4">
                <label class="form-label">PHONE NUMBER <span class="rose">*</span></label>
                <input type="tel" class="form-control" placeholder="+62 812 3456 7890">
            </div>
            <div class="col-md-4">
                <label class="form-label">SELECT DOCTOR <span class="rose">*</span></label>
                <select class="form-select">
                    <option value="Choose a doctor">Choose a doctor</option>
                    <option value="Dr.Salwa Az-Zahra Munir">Dr.Salwa Az-Zahra Munir</option>
                    <option value="Dr.Daaniys Nadya Shafwa">Dr.Daaniys Nadya Shafwa</option>
                    <option value="Dr.Shania Risky Agustin">Dr.Shania Risky Agustin</option>
                    <option value="Dr.Olga Hadi Purna Wahab Basalamah">Dr.Olga Hadi Purna Wahab Basalamah</option>
                    <option value="Dr.Reynaldo William Tendean">Dr.Reynaldo William Tendean</option>
                    <option value="Dr.A. Muh. Ilhamsyah Bau Mange">Dr.A. Muh. Ilhamsyah Bau Mange</option>
                </select>
            </div>
            <div class="col-md-4">
                    <label class="form-label">DATE <span class="rose">*</span></label>
                    <input type="date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">PREFFERED TIME <span class="rose">*</span></label>
                <select class="form-select">
                    <option value="Select time">Select time</option>
                    <option value="08.00">08.00</option>
                    <option value="08.30">08.30</option>
                    <option value="09.00">09.00</option>
                    <option value="09.30">09.30</option>
                    <option value="10.00">10.00</option>
                    <option value="10.30">10.30</option>
                    <option value="11.00">11.00</option>
                    <option value="11.30">11.30</option>
                    <option value="12.00">12.00</option>
                    <option value="12.30">12.30</option>
                    <option value="13.00">13.00</option>
                    <option value="13.30">13.30</option>
                    <option value="14.00">14.00</option>
                    <option value="14.30">14.30</option>
                    <option value="15.00">15.00</option>
                    <option value="15.30">15.30</option>
                    <option value="16.00">16.00</option>
                    <option value="16.30">16.30</option>
                    <option value="17.00">17.00</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">REASON FOR VISIT <span class="rose">*</span></label>
                <input type="text" class="form-control" placeholder="e.g. Chest pain, follow up..">
            </div>
            <div class="col-12 d-flex align-items-center justify-content-between gap-5">
                <p class="text-xs">
                    Queue position is assigned by booking time. Fields marked  <span class="rose">*</span> are required.
                </p>
                <button type="submit" class="btn btn-success">Confirm Booking</button>
            </div>
        </form>
    </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
