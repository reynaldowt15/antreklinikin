<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Book a Consultation</h2>
        <p>
            Register your name and select a doctor to join the queue.
        </p>
        <form class="row g-3">
            <div class="col-md-4">
                <label class="form-label">FULL NAME</label>
                <input type="text" class="form-control" placeholder="e.g. Ahmad">
            </div>
            <div class="col-md-4">
                <label class="form-label">PHONE NUMBER</label>
                <input type="tel" class="form-control" placeholder="+62 812 3456 7890">
            </div>
            <div class="col-md-4">
                <label class="form-label">SELECT DOCTOR</label>
                <select class="form-select">
                    <option value="Choose a doctor">Choose a doctor</option>
                    <option value="Dr.Salwa Az-Zahra Munir">Dr.Salwa Az-Zahra Munir</option>
                    <option value="Dr.Daaniys Nadya Shafwa">Dr.Daaniys Nadya Shafwa</option>
                    <option value="Dr.Shania Risky Agustin">Dr.Shania Risky Agustin</option>
                    <option value="Dr.Olga Hadi Purna Wahab Basalamah">Dr.Olga Hadi Purna Wahab Basalamah</option>
                    <option value="Dr.Reynaldo William Tendean">Dr.Reynaldo William Tendean</option>
                    <option value="Dr.A. Muh. Ilhamsyah Bau Mange">Dr.A. Muh. Ilhamsyah Bau Mange</option>
                </select>
            </div>
            <div class="col-md-4">
                    <label class="form-label">DATE</label>
                    <input type="date" class="form-control" max="1979-12-31">
            </div>
            <div class="col-md-4">
                <label class="form-label">PREFFERED TIME</label>
                <select class="form-select">
                    <option value="Select time">Select time</option>
                    <option value="08.00">08.00</option>
                    <option value="08.30">08.30</option>
                    <option value="09.00">09.00</option>
                    <option value="09.30">09.30</option>
                    <option value="10.00">10.00</option>
                    <option value="10.30">10.30</option>
                    <option value="11.00">11.00</option>
                    <option value="11.30">11.30</option>
                    <option value="12.00">12.00</option>
                    <option value="12.30">12.30</option>
                    <option value="13.00">13.00</option>
                    <option value="13.30">13.30</option>
                    <option value="14.00">14.00</option>
                    <option value="14.30">14.30</option>
                    <option value="15.00">15.00</option>
                    <option value="15.30">15.30</option>
                    <option value="16.00">16.00</option>
                    <option value="16.30">16.30</option>
                    <option value="17.00">17.00</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">REASON FOR VISIT</label>
                <input type="text" class="form-control" placeholder="e.g. Chest pain, follow up..">
            </div>
            <div class="col-12 d-flex align-items-center justify-content-between gap-3">
                <p class="text-muted- mb-0">
                    Queue position is assigned by booking time. Fields marked * are required.
                </p>
                <button type="submit" class="btn btn-success">Confirm Booking</button>
            </div>
        </form>
    </div>
</body>
</html>
